<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kuro Ramen</title><style>body{margin:0;font-family:system-ui;background:#0b0b0b;color:#fff}.wrap{max-width:1200px;margin:auto;padding:20px}.card{background:#18181b;border-radius:24px;padding:20px;margin:12px 0}.grid{display:grid;gap:20px}.btn{background:#27272a;color:#fff;border:none;border-radius:14px;padding:12px;cursor:pointer}.active{background:#dc2626}.row{display:flex;gap:10px;flex-wrap:wrap}.schedule{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.menuitem{display:flex;justify-content:space-between;align-items:center;background:#27272a;padding:12px;border-radius:12px;margin:8px 0}.green{background:#16a34a}.note{background:#78350f;padding:12px;border-radius:12px}.total{font-size:32px;color:#ef4444;font-weight:bold}input{width:100%;padding:12px;margin:6px 0;border-radius:12px;border:none}@media(min-width:900px){.grid{grid-template-columns:1fr 1fr}}</style></head><body><div class=wrap><h1>🍜 KURO RAMEN</h1><div class=grid><div class=card><h3>📍 Ciudad</h3><div class=row><button id=g class='btn active' onclick="setCity('Guasave')">Guasave</button><button id=c class='btn' onclick="setCity('Culiacán')">Culiacán</button></div><h3>Servicio</h3><div class=row><button id=r class='btn active' onclick="setSvc('Reserva')">Reserva</button><button id=p class='btn' onclick="setSvc('Pedido para llevar')">Pedido para llevar</button></div><input id=nombre placeholder='Nombre'><input id=telefono placeholder='Teléfono'><div id=personasBox><h4>👥 Personas</h4><button class=btn onclick='people=Math.max(1,people-1);render()'>-</button> <span id=peopleLbl>1</span> <button class='btn active' onclick='if(people<10) people++;render()'>+</button></div><h4>📅 Fecha</h4><div id=fechas class=row></div><h4>⏰ Horario</h4><div id=horarios class=schedule></div><div id=leyenda class=note>👥 Cupo limitado a 10 personas por horario.</div></div><div class=card><h3>🍜 Menú</h3><div id=menu></div></div></div><div class=card><h3>📋 Resumen</h3><div id=resumen></div><div id=total class=total>$0</div><button id=sendBtn class='btn green' style='width:100%;margin-top:10px' onclick='sendWA()'>🟢 Enviar reserva</button></div></div><script>let city='Guasave',svc='Reserva',people=1,date='20 Noviembre',time='';const qty={};const dates={Guasave:['20 Noviembre','21 Noviembre'],'Culiacán':['22 Noviembre']};const hours={Guasave:{Reserva:['2:00 PM','4:00 PM','6:00 PM','8:00 PM'],'Pedido para llevar':['3:00 PM','5:00 PM','7:00 PM','9:00 PM']},'Culiacán':{Reserva:['4:00 PM','6:00 PM','8:00 PM'],'Pedido para llevar':['5:00 PM','7:00 PM','9:00 PM']}};const items=[['🥟 Gyozas',160],['🍗 Karaage',140],['🍜 Tonkotsu',240],['🍜 Karai Tonkotsu',250],['🌱 Tofu-Men',250],['🥤 Calpis',50],['🧋 Milk Tea Oolong',70],['🍹 Drink Coqueto',100,'Culiacán']];function setCity(v){city=v;date=dates[v][0];time='';render()}function setSvc(v){svc=v;time='';render()}function render(){g.className='btn'+(city==='Guasave'?' active':'');c.className='btn'+(city==='Culiacán'?' active':'');r.className='btn'+(svc==='Reserva'?' active':'');p.className='btn'+(svc!=='Reserva'?' active':'');sendBtn.textContent=svc==='Reserva'?'🟢 Enviar reserva':'🟢 Enviar pedido';peopleLbl.textContent=people;personasBox.style.display=svc==='Reserva'?'block':'none';leyenda.style.display=svc==='Reserva'?'block':'none';fechas.innerHTML='';dates[city].forEach(d=>fechas.innerHTML+=`<button class="btn ${date===d?'active':''}" onclick="date='${d}';render()">${d}</button>`);horarios.innerHTML='';hours[city][svc].forEach(h=>horarios.innerHTML+=`<button class="btn ${time===h?'active':''}" onclick="time='${h}';render()">${h}</button>`);let totalCalc=0,m='';items.filter(i=>!i[2]||i[2]===city).forEach(i=>{qty[i[0]]??=0;totalCalc+=qty[i[0]]*i[1];m+=`<div class='menuitem'><div>${i[0]}<br>$${i[1]}</div><div><button class='btn' onclick="qty['${i[0]}']=Math.max(0,qty['${i[0]}']-1);render()">-</button> ${qty[i[0]]} <button class='btn active' onclick="qty['${i[0]}']++;render()">+</button></div></div>`});menu.innerHTML=m;document.getElementById('total').textContent='$'+totalCalc;const tipoTxt=svc==='Reserva'?'🍽️ Reserva':'🛍️ Pedido para llevar';resumen.innerHTML=`📍 ${city}<br>${tipoTxt}<br>📅 ${date}<br>⏰ ${time||'Sin seleccionar'}<br>${svc==='Reserva'?'👥 '+people+' personas<br>⭐ Te agradecemos llegar puntualmente.<br>⏱️ Tiempo de servicio: 1 hora con 30 minutos':''}<br><br>💰 Total: $${totalCalc}`;}function sendWA(){const n=nombre.value.trim(),t=telefono.value.trim();if(!n){alert('Ingresa tu nombre');return;}if(!t){alert('Ingresa tu teléfono');return;}if(!time){alert('Selecciona horario');return;}let totalCalc=0,p=[];items.filter(i=>!i[2]||i[2]===city).forEach(i=>{const c=qty[i[0]]||0;if(c){p.push(c+'x '+i[0]);totalCalc+=c*i[1];}});let msg=`🍜 KURO RAMEN
📍 ${city}
${svc==='Reserva'?'🍽️ Reserva':'🛍️ Pedido para llevar'}
📅 ${date}
⏰ ${time}
👤 ${n}
📱 ${t}
`;if(svc==='Reserva')msg+=`👥 ${people} personas
`;msg+=`
🍜 PEDIDO
${p.length?p.join('\n'):'Sin productos'}

💰 Total: $${totalCalc}`;window.open('https://wa.me/526871343731?text='+encodeURIComponent(msg),'_blank');}render();</script></body></html>
